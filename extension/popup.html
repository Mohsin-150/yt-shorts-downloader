<!DOCTYPE html>
<html>
  <head>
    <title>YT Shorts Downloader</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 15px;
        width: 220px;
        margin: 0;
      }
      h3 {
        margin: 0 0 12px 0;
        font-size: 16px;
        color: #333;
        text-align: center;
      }
      button {
        padding: 12px;
        width: 100%;
        font-size: 14px;
        background-color: #ff0000;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        transition: background-color 0.2s;
      }
      button:hover:not(:disabled) {
        background-color: #cc0000;
      }
      button:disabled {
        background-color: #999;
        cursor: not-allowed;
      }
      .info {
        margin-top: 10px;
        font-size: 11px;
        color: #666;
        text-align: center;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h3>🎥 YT Shorts Downloader</h3>
    <button id="download">Download Shorts in HD</button>
    <div class="info">
      Make sure you're on a YouTube Shorts page
    </div>
    <script src="popup.js"></script>
  </body>
</html>
